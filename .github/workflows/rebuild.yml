# Щоденна перезбірка сайту. Сайт статичний: «майбутні / минулі» події й виділений день у календарі
# рахуються під час збірки. Без перезбірки минула подія лишалася б у «найближчих».
#
# Як працює: щоночі (і за кнопкою «Run workflow» у вкладці Actions) GitHub викликає Deploy Hook
# Cloudflare Pages — Cloudflare заново збирає й публікує гілку main. Адреса хука — секрет репозиторію
# CLOUDFLARE_DEPLOY_HOOK (створює Михайло в Cloudflare: Workers & Pages → tk-globus → Settings → Builds →
# Deploy hooks). Через кілька хвилин живий сайт перевіряє npm run check:live (404, редиректи, превʼю посилань).
#
# Без секрету перезбірку пропущено (лише попередження), а check-live перевіряє старий білд — ту версію, що
# вже на продакшні. Лист про червоний (невдалий) прогін за розкладом GitHub надсилає лише автору workflow
# (хто востаннє змінював цей файл), а не всім адмінам — інші бачать статус у вкладці Actions.
#
# Увага: GitHub вимикає розклад у публічному репозиторії, якщо в ньому 60 днів не було жодних змін, —
# тоді ввімкніть workflow знову у вкладці Actions.
name: Щоденна перезбірка

on:
  schedule:
    # 22:10 UTC — одразу після півночі за Києвом (00:10 взимку, 01:10 влітку). GitHub може запізнитися на кілька хвилин.
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    name: Перезібрати сайт на Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Викликати Deploy Hook Cloudflare Pages
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::Немає секрету CLOUDFLARE_DEPLOY_HOOK — перезбірку пропущено. Як додати: див. коментар на початку .github/workflows/rebuild.yml."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 10 -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Cloudflare отримав запит на перезбірку main."

  check-live:
    name: Перевірити живий сайт
    needs: rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Збірка на Cloudflare триває кілька хвилин; перевіряємо після неї (або попередню версію, якщо вона ще йде).
      - name: Почекати на збірку Cloudflare
        run: sleep 300

      - name: Перевірка живого сайту (404, редиректи, превʼю посилань)
        run: node scripts/check-live.mjs https://tk-globus.pages.dev
